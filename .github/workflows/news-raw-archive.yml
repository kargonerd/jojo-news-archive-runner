name: News raw archive

run-name: >-
  news-raw-${{ inputs.publisher }}-${{ inputs.from_year }}-${{ inputs.to_year }}-${{ inputs.manifest_mode }}

on:
  workflow_dispatch:
    inputs:
      publisher:
        description: "Publisher archive to advance."
        required: true
        type: choice
        options:
          - ap
          - wsj
          - bloomberg
          - nyt
          - reuters
          - ft
      from_year:
        description: "First discovery/capture year."
        required: true
        default: "2016"
        type: string
      to_year:
        description: "Last discovery/capture year."
        required: true
        default: "2026"
        type: string
      manifest_mode:
        description: "Catalog source for this publisher window."
        required: true
        default: "wayback"
        type: choice
        options:
          - sitemap-wayback
          - reuters-sitemap-wayback
          - wayback
          - wayback-urlkey
          - committed-bloomberg-2020
      max_discovery_pages:
        description: "Maximum CDX pages or sitemap files in this run."
        required: true
        default: "5"
        type: string
      max_captures:
        description: "Maximum raw HTML captures in this run."
        required: true
        default: "500"
        type: string
      workers:
        description: "Concurrent archive replay downloads."
        required: true
        default: "4"
        type: string
      max_runtime_minutes:
        description: "Stop starting captures after this many minutes."
        required: true
        default: "300"
        type: string
      auto_continue:
        description: "Dispatch the next bounded run after a durable checkpoint."
        required: true
        default: true
        type: boolean

permissions:
  actions: write
  contents: read

concurrency:
  group: >-
    news-raw-${{ inputs.publisher }}-${{ inputs.from_year }}-${{ inputs.to_year }}-${{ inputs.manifest_mode }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  B2_ARCHIVE_KEY_ID: ${{ secrets.B2_ARCHIVE_KEY_ID }}
  B2_ARCHIVE_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_APPLICATION_KEY }}
  B2_ARCHIVE_BUCKET: ${{ secrets.B2_ARCHIVE_BUCKET }}
  B2_REMOTE: jojo-b2
  ARCHIVE_ROOT: ${{ github.workspace }}/.archive-work
  PUBLISHER: ${{ inputs.publisher }}
  FROM_YEAR: ${{ inputs.from_year }}
  TO_YEAR: ${{ inputs.to_year }}
  MANIFEST_MODE: ${{ inputs.manifest_mode }}
  MAX_DISCOVERY_PAGES: ${{ inputs.max_discovery_pages }}
  MAX_CAPTURES: ${{ inputs.max_captures }}
  DOWNLOAD_WORKERS: ${{ inputs.workers }}
  MAX_RUNTIME_MINUTES: ${{ inputs.max_runtime_minutes }}
  MAX_RECORD_ATTEMPTS: "3"

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/olds-api/requirements.txt

      - name: Install archive dependencies
        run: |
          python -m pip install -r services/olds-api/requirements.txt
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Validate private B2 storage
        run: |
          python services/olds-api/tools/verify_b2_private_bucket.py
          rclone config create "$B2_REMOTE" b2 \
            account "$B2_ARCHIVE_KEY_ID" \
            key "$B2_ARCHIVE_APPLICATION_KEY" \
            --non-interactive

      - name: Resolve archive paths
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          if [ "$MANIFEST_MODE" = "committed-bloomberg-2020" ]; then
            if [ "$PUBLISHER" != "bloomberg" ] ||
               [ "$FROM_YEAR" != "2020" ] ||
               [ "$TO_YEAR" != "2020" ]; then
              echo "The committed catalog is only valid for Bloomberg 2020." >&2
              exit 2
            fi
          fi
          if [ "$MANIFEST_MODE" = "reuters-sitemap-wayback" ] &&
             [ "$PUBLISHER" != "reuters" ]; then
            echo "reuters-sitemap-wayback is only valid for Reuters." >&2
            exit 2
          fi
          if [ "$MANIFEST_MODE" = "wayback-urlkey" ] &&
             [[ ! "$PUBLISHER" =~ ^(wsj|reuters)$ ]]; then
            echo "wayback-urlkey supports WSJ and Reuters." >&2
            exit 2
          fi
          if [ "$MANIFEST_MODE" = "sitemap-wayback" ] &&
             [[ ! "$PUBLISHER" =~ ^(ap|bloomberg|nyt|ft)$ ]]; then
            echo "sitemap-wayback supports AP, Bloomberg, NYT, and FT." >&2
            exit 2
          fi
          shard="${PUBLISHER}/${FROM_YEAR}-${TO_YEAR}/${MANIFEST_MODE}"
          local_root="${ARCHIVE_ROOT}/${shard}"
          remote_root="${B2_REMOTE}:${B2_ARCHIVE_BUCKET}/news-archive/v1/${shard}"
          mkdir -p "$local_root/catalog" "$local_root/raw"
          {
            echo "shard=$shard"
            echo "local_root=$local_root"
            echo "remote_root=$remote_root"
          } >> "$GITHUB_OUTPUT"

      - name: Restore discovery and capture checkpoints
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
          REMOTE_ROOT: ${{ steps.paths.outputs.remote_root }}
        run: |
          set -euo pipefail
          restore_if_present() {
            remote_file="$1"
            local_file="$2"
            remote_dir="${remote_file%/*}"
            remote_name="${remote_file##*/}"
            listing="$RUNNER_TEMP/rclone-listing.txt"
            errors="$RUNNER_TEMP/rclone-listing-errors.txt"
            if ! rclone lsf "$remote_dir" --files-only >"$listing" 2>"$errors"; then
              if grep -qiE "directory not found|object not found" "$errors"; then
                return 0
              fi
              cat "$errors" >&2
              return 1
            fi
            if grep -Fxq "$remote_name" "$listing"; then
              mkdir -p "$(dirname "$local_file")"
              rclone copyto "$remote_file" "$local_file" \
                --retries 8 --low-level-retries 20
            fi
          }

          restore_if_present \
            "${REMOTE_ROOT}/catalog/discovery.sqlite3.gz" \
            "$RUNNER_TEMP/discovery.sqlite3.gz"
          if [ -f "$RUNNER_TEMP/discovery.sqlite3.gz" ]; then
            gzip -dc "$RUNNER_TEMP/discovery.sqlite3.gz" \
              > "$LOCAL_ROOT/catalog/discovery.sqlite3"
          fi

          restore_if_present \
            "${REMOTE_ROOT}/catalog/manifest.jsonl.gz" \
            "$LOCAL_ROOT/catalog/manifest.jsonl.gz"

          restore_if_present \
            "${REMOTE_ROOT}/state/capture.sqlite3.gz" \
            "$RUNNER_TEMP/capture.sqlite3.gz"
          if [ -f "$RUNNER_TEMP/capture.sqlite3.gz" ]; then
            gzip -dc "$RUNNER_TEMP/capture.sqlite3.gz" \
              > "$LOCAL_ROOT/raw/capture.sqlite3"
          fi

      - name: Advance or select manifest
        id: catalog
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
        run: |
          set -euo pipefail
          manifest="$LOCAL_ROOT/catalog/manifest.jsonl.gz"
          if [ "$MANIFEST_MODE" = "committed-bloomberg-2020" ]; then
            cp \
              services/olds-api/data/bloomberg-2020-archive-manifest.jsonl.gz \
              "$manifest"
            echo "complete=true" >> "$GITHUB_OUTPUT"
            echo "capture_ready=true" >> "$GITHUB_OUTPUT"
            echo "should_continue=false" >> "$GITHUB_OUTPUT"
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          if [ "$MANIFEST_MODE" = "sitemap-wayback" ]; then
            python services/olds-api/tools/build_sitemap_manifest.py \
              --publisher "$PUBLISHER" \
              --from-year "$FROM_YEAR" \
              --to-year "$TO_YEAR" \
              --output "$manifest" \
              --state "$LOCAL_ROOT/catalog/discovery.sqlite3" \
              --max-sitemaps "$MAX_DISCOVERY_PAGES" \
              --min-request-interval 1.0 \
              --github-output "$GITHUB_OUTPUT"
          elif [ "$MANIFEST_MODE" = "reuters-sitemap-wayback" ]; then
            python services/olds-api/tools/build_reuters_sitemap_manifest.py \
              --publisher "$PUBLISHER" \
              --from-year "$FROM_YEAR" \
              --to-year "$TO_YEAR" \
              --output "$manifest" \
              --state "$LOCAL_ROOT/catalog/discovery.sqlite3" \
              --max-sitemaps "$MAX_DISCOVERY_PAGES" \
              --min-request-interval 0.5 \
              --github-output "$GITHUB_OUTPUT"
          elif [ "$MANIFEST_MODE" = "wayback-urlkey" ]; then
            python services/olds-api/tools/build_wayback_manifest.py \
              --publisher "$PUBLISHER" \
              --from-year "$FROM_YEAR" \
              --to-year "$TO_YEAR" \
              --output "$manifest" \
              --state "$LOCAL_ROOT/catalog/discovery.sqlite3" \
              --page-limit 2000 \
              --max-pages "$MAX_DISCOVERY_PAGES" \
              --min-request-interval 1.0 \
              --collapse urlkey \
              --github-output "$GITHUB_OUTPUT"
          else
            python services/olds-api/tools/build_wayback_manifest.py \
              --publisher "$PUBLISHER" \
              --from-year "$FROM_YEAR" \
              --to-year "$TO_YEAR" \
              --output "$manifest" \
              --state "$LOCAL_ROOT/catalog/discovery.sqlite3" \
              --page-limit 2000 \
              --max-pages "$MAX_DISCOVERY_PAGES" \
              --min-request-interval 1.0 \
              --github-output "$GITHUB_OUTPUT"
          fi
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Checkpoint discovery
        if: >-
          ${{
            always() &&
            !cancelled() &&
            inputs.manifest_mode != 'committed-bloomberg-2020' &&
            hashFiles('.archive-work/**/catalog/discovery.sqlite3') != ''
          }}
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          path = Path(os.environ["LOCAL_ROOT"]) / "catalog" / "discovery.sqlite3"
          connection = sqlite3.connect(path, timeout=60)
          connection.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          connection.close()
          PY
          gzip -9 -c "$LOCAL_ROOT/catalog/discovery.sqlite3" \
            > "$RUNNER_TEMP/discovery.sqlite3.gz"

      - name: Publish discovery checkpoint and manifest
        if: >-
          ${{
            always() &&
            !cancelled() &&
            inputs.manifest_mode != 'committed-bloomberg-2020' &&
            hashFiles('.archive-work/**/catalog/discovery.sqlite3') != ''
          }}
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
          REMOTE_ROOT: ${{ steps.paths.outputs.remote_root }}
        run: |
          set -euo pipefail
          if [ -f "$LOCAL_ROOT/catalog/manifest.jsonl.gz" ]; then
            rclone copyto \
              "$LOCAL_ROOT/catalog/manifest.jsonl.gz" \
              "${REMOTE_ROOT}/catalog/manifest.jsonl.gz" \
              --retries 8 --low-level-retries 20
          fi
          rclone copyto \
            "$RUNNER_TEMP/discovery.sqlite3.gz" \
            "${REMOTE_ROOT}/catalog/discovery.sqlite3.gz" \
            --retries 8 --low-level-retries 20

      - name: Plan capture batch
        id: before
        if: >-
          ${{
            steps.catalog.outputs.complete == 'true' ||
            steps.catalog.outputs.capture_ready == 'true'
          }}
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
        run: |
          python services/olds-api/tools/capture_action_state.py \
            --state "$LOCAL_ROOT/raw/capture.sqlite3" \
            --max-record-attempts "$MAX_RECORD_ATTEMPTS" \
            --github-output "$GITHUB_OUTPUT"

      - name: Plan replay of previously captured parser samples
        id: validation_replay
        if: >-
          ${{
            steps.catalog.outputs.complete == 'true' ||
            steps.catalog.outputs.capture_ready == 'true'
          }}
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
        run: |
          python \
            services/olds-api/tools/prepare_parser_validation_replay.py \
            --publisher "$PUBLISHER" \
            --state "$LOCAL_ROOT/raw/capture.sqlite3" \
            --from-year "$FROM_YEAR" \
            --to-year "$TO_YEAR" \
            --target-per-year 500 \
            --max-record-attempts "$MAX_RECORD_ATTEMPTS" \
            --max-replays 2000 \
            --files-from "$RUNNER_TEMP/parser-validation-files.txt" \
            --github-output "$GITHUB_OUTPUT"

      - name: Restore previously captured parser sample HTML
        if: ${{ steps.validation_replay.outputs.replays != '0' }}
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
          REMOTE_ROOT: ${{ steps.paths.outputs.remote_root }}
        run: |
          rclone copy \
            "${REMOTE_ROOT}/raw" \
            "$LOCAL_ROOT/raw" \
            --files-from "$RUNNER_TEMP/parser-validation-files.txt" \
            --transfers 16 --checkers 32 \
            --retries 8 --low-level-retries 20 \
            --stats 30s

      - name: Replay current parser against restored sample HTML
        if: ${{ steps.validation_replay.outputs.replays != '0' }}
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
        run: |
          python services/olds-api/tools/revalidate_parser_samples.py \
            --publisher "$PUBLISHER" \
            --state "$LOCAL_ROOT/raw/capture.sqlite3" \
            --archive-root "$LOCAL_ROOT/raw" \
            --max-replays 2000 \
            --progress-every 50 \
            --summary "$LOCAL_ROOT/raw/summary.json"

      - name: Publish parser validation replay checkpoint
        if: ${{ steps.validation_replay.outputs.replays != '0' }}
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
          REMOTE_ROOT: ${{ steps.paths.outputs.remote_root }}
        run: |
          python services/olds-api/tools/checkpoint_capture_state.py \
            --state "$LOCAL_ROOT/raw/capture.sqlite3" \
            --output "$RUNNER_TEMP/parser-replay.sqlite3.gz"
          rclone copyto \
            "$LOCAL_ROOT/raw/summary.json" \
            "${REMOTE_ROOT}/state/summary.json" \
            --retries 8 --low-level-retries 20
          rclone copyto \
            "$RUNNER_TEMP/parser-replay.sqlite3.gz" \
            "${REMOTE_ROOT}/state/capture.sqlite3.gz" \
            --retries 8 --low-level-retries 20

      - name: Capture bounded raw HTML batch
        id: capture
        if: >-
          ${{
            steps.catalog.outputs.complete == 'true' ||
            steps.catalog.outputs.capture_ready == 'true'
          }}
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
          REMOTE_ROOT: ${{ steps.paths.outputs.remote_root }}
        run: |
          set -uo pipefail
          live_checkpoint() {
            local checkpoint="$RUNNER_TEMP/capture-live.sqlite3.gz"
            if ! python \
              services/olds-api/tools/checkpoint_capture_state.py \
              --state "$LOCAL_ROOT/raw/capture.sqlite3" \
              --output "$checkpoint"; then
              echo "::warning::Could not snapshot live capture state."
              return 0
            fi
            if [ -d "$LOCAL_ROOT/raw/objects" ]; then
              if ! rclone copy \
                  "$LOCAL_ROOT/raw/objects" \
                  "${REMOTE_ROOT}/raw/objects" \
                  --exclude '*.tmp' \
                  --checksum --immutable --fast-list \
                  --transfers 32 --checkers 64 \
                  --retries 8 --low-level-retries 20; then
                echo "::warning::Live object upload failed; state withheld."
                return 0
              fi
            fi
            if [ -d "$LOCAL_ROOT/raw/records" ]; then
              # Records are URL-addressed and may change after a bad capture
              # is requeued; B2 keeps prior object versions for recovery.
              if ! rclone copy \
                  "$LOCAL_ROOT/raw/records" \
                  "${REMOTE_ROOT}/raw/records" \
                  --exclude '*.tmp' \
                  --checksum --fast-list \
                  --transfers 32 --checkers 64 \
                  --retries 8 --low-level-retries 20; then
                echo "::warning::Live record upload failed; state withheld."
                return 0
              fi
            fi
            if [ -f "$LOCAL_ROOT/raw/summary.json" ]; then
              rclone copyto \
                "$LOCAL_ROOT/raw/summary.json" \
                "${REMOTE_ROOT}/state/summary.json" \
                --retries 8 --low-level-retries 20
            fi
            # The snapshot was taken before object upload and is published
            # last, so every capture it references is already durable.
            rclone copyto \
              "$checkpoint" \
              "${REMOTE_ROOT}/state/capture.sqlite3.gz" \
              --retries 8 --low-level-retries 20
            echo "Published live capture checkpoint."
          }
          args=(
            --publisher "$PUBLISHER"
            --manifest "$LOCAL_ROOT/catalog/manifest.jsonl.gz"
            --output-dir "$LOCAL_ROOT/raw"
            --workers "$DOWNLOAD_WORKERS"
            --min-request-interval 0.5
            --max-captures "$MAX_CAPTURES"
            --max-runtime-minutes "$MAX_RUNTIME_MINUTES"
            --max-record-attempts "$MAX_RECORD_ATTEMPTS"
            --validation-sample-per-year 500
            --validation-from-year "$FROM_YEAR"
            --validation-to-year "$TO_YEAR"
            --progress-every 25
            --minimum-free-gb 2
          )
          if [ "${{ steps.before.outputs.retry_errors }}" = "true" ]; then
            args+=(--retry-errors)
          fi
          set +e
          python services/olds-api/tools/capture_archive_batch.py "${args[@]}" &
          capture_pid=$!
          while kill -0 "$capture_pid" 2>/dev/null; do
            timeout 600 tail --pid="$capture_pid" -f /dev/null
            wait_code=$?
            if [ "$wait_code" -eq 124 ]; then
              live_checkpoint
            else
              break
            fi
          done
          wait "$capture_pid"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Checkpoint capture state
        if: >-
          ${{
            always() &&
            !cancelled() &&
            (
              steps.catalog.outputs.complete == 'true' ||
              steps.catalog.outputs.capture_ready == 'true'
            ) &&
            hashFiles('.archive-work/**/raw/capture.sqlite3') != ''
          }}
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          path = Path(os.environ["LOCAL_ROOT"]) / "raw" / "capture.sqlite3"
          connection = sqlite3.connect(path, timeout=60)
          connection.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          connection.close()
          PY
          gzip -9 -c "$LOCAL_ROOT/raw/capture.sqlite3" \
            > "$RUNNER_TEMP/capture.sqlite3.gz"

      - name: Publish raw objects, records, and capture checkpoint
        if: >-
          ${{
            always() &&
            !cancelled() &&
            (
              steps.catalog.outputs.complete == 'true' ||
              steps.catalog.outputs.capture_ready == 'true'
            ) &&
            hashFiles('.archive-work/**/raw/capture.sqlite3') != ''
          }}
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
          REMOTE_ROOT: ${{ steps.paths.outputs.remote_root }}
        run: |
          set -euo pipefail
          if [ -d "$LOCAL_ROOT/raw/objects" ]; then
            rclone copy \
              "$LOCAL_ROOT/raw/objects" \
              "${REMOTE_ROOT}/raw/objects" \
              --exclude '*.tmp' \
              --checksum --immutable --fast-list \
              --transfers 32 --checkers 64 \
              --retries 8 --low-level-retries 20 \
              --stats 30s
          fi
          if [ -d "$LOCAL_ROOT/raw/records" ]; then
            # Records are URL-addressed and intentionally replaceable after
            # recapture; raw HTML objects above remain content-addressed.
            rclone copy \
              "$LOCAL_ROOT/raw/records" \
              "${REMOTE_ROOT}/raw/records" \
              --exclude '*.tmp' \
              --checksum --fast-list \
              --transfers 32 --checkers 64 \
              --retries 8 --low-level-retries 20 \
              --stats 30s
          fi
          if [ -f "$LOCAL_ROOT/raw/summary.json" ]; then
            rclone copyto \
              "$LOCAL_ROOT/raw/summary.json" \
              "${REMOTE_ROOT}/state/summary.json" \
              --retries 8 --low-level-retries 20
          fi
          # Publish state last so it never references objects absent from B2.
          rclone copyto \
            "$RUNNER_TEMP/capture.sqlite3.gz" \
            "${REMOTE_ROOT}/state/capture.sqlite3.gz" \
            --retries 8 --low-level-retries 20

      - name: Report remaining capture work
        id: after
        if: >-
          ${{
            always() &&
            !cancelled() &&
            (
              steps.catalog.outputs.complete == 'true' ||
              steps.catalog.outputs.capture_ready == 'true'
            ) &&
            hashFiles('.archive-work/**/raw/capture.sqlite3') != ''
          }}
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
        run: |
          python services/olds-api/tools/capture_action_state.py \
            --state "$LOCAL_ROOT/raw/capture.sqlite3" \
            --max-record-attempts "$MAX_RECORD_ATTEMPTS" \
            --github-output "$GITHUB_OUTPUT"

      - name: Dispatch next bounded run
        if: >-
          ${{
            inputs.auto_continue &&
            steps.catalog.outputs.exit_code == '0' &&
            (
              steps.catalog.outputs.should_continue == 'true' ||
              (
                steps.capture.outputs.exit_code == '0' &&
                steps.after.outputs.should_continue == 'true'
              )
            )
          }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run news-raw-archive.yml \
            --ref "$GITHUB_REF_NAME" \
            -f publisher="$PUBLISHER" \
            -f from_year="$FROM_YEAR" \
            -f to_year="$TO_YEAR" \
            -f manifest_mode="$MANIFEST_MODE" \
            -f max_discovery_pages="$MAX_DISCOVERY_PAGES" \
            -f max_captures="$MAX_CAPTURES" \
            -f workers="$DOWNLOAD_WORKERS" \
            -f max_runtime_minutes="$MAX_RUNTIME_MINUTES" \
            -f auto_continue=true

      - name: Propagate capture failure after checkpoint
        if: >-
          ${{
            (
              steps.catalog.outputs.complete == 'true' ||
              steps.catalog.outputs.capture_ready == 'true'
            ) &&
            steps.capture.outputs.exit_code != '0'
          }}
        run: |
          echo "Capture process exited with code ${{ steps.capture.outputs.exit_code }}." >&2
          exit 1

      - name: Propagate discovery failure after checkpoint
        if: ${{ steps.catalog.outputs.exit_code != '0' }}
        run: |
          echo "Manifest discovery exited with code ${{ steps.catalog.outputs.exit_code }}." >&2
          exit 1
