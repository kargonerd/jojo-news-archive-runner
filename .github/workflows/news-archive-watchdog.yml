name: News archive watchdog

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: news-archive-watchdog
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        archive:
          - publisher: bloomberg
            from_year: "2016"
            to_year: "2026"
            manifest_mode: sitemap-wayback
            discovery_units: "1"
            runner_os: ubuntu-latest
          - publisher: nyt
            from_year: "2016"
            to_year: "2026"
            manifest_mode: sitemap-wayback
            discovery_units: "10"
            runner_os: macos-15-intel
          - publisher: ft
            from_year: "2016"
            to_year: "2026"
            manifest_mode: sitemap-wayback
            discovery_units: "1"
            runner_os: ubuntu-latest
          - publisher: wsj
            from_year: "2010"
            to_year: "2015"
            manifest_mode: wayback-urlkey
            discovery_units: "30"
            runner_os: ubuntu-latest
          - publisher: wsj
            from_year: "2016"
            to_year: "2026"
            manifest_mode: wayback-urlkey
            discovery_units: "5"
            runner_os: ubuntu-latest
          - publisher: reuters
            from_year: "2016"
            to_year: "2020"
            manifest_mode: wayback-urlkey
            discovery_units: "25"
            runner_os: ubuntu-latest
          - publisher: reuters
            from_year: "2021"
            to_year: "2026"
            manifest_mode: reuters-sitemap-wayback
            discovery_units: "25"
            runner_os: ubuntu-latest
          - publisher: npr
            from_year: "2010"
            to_year: "2015"
            manifest_mode: wayback-urlkey
            discovery_units: "5"
            runner_os: ubuntu-latest
          - publisher: axios
            from_year: "2017"
            to_year: "2026"
            manifest_mode: wayback-urlkey
            discovery_units: "5"
            runner_os: ubuntu-latest
          - publisher: aljazeera
            from_year: "2010"
            to_year: "2015"
            manifest_mode: sitemap-wayback
            discovery_units: "24"
            runner_os: ubuntu-latest
          - publisher: aljazeera
            from_year: "2016"
            to_year: "2026"
            manifest_mode: sitemap-wayback
            discovery_units: "24"
            runner_os: ubuntu-latest
          - publisher: zaobao
            from_year: "2016"
            to_year: "2026"
            manifest_mode: sitemap-wayback
            discovery_units: "24"
            runner_os: ubuntu-latest
    steps:
      - name: Advance archive shard
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHER: ${{ matrix.archive.publisher }}
          FROM_YEAR: ${{ matrix.archive.from_year }}
          TO_YEAR: ${{ matrix.archive.to_year }}
          MANIFEST_MODE: ${{ matrix.archive.manifest_mode }}
          DISCOVERY_UNITS: ${{ matrix.archive.discovery_units }}
          TARGET_RUNNER_OS: ${{ matrix.archive.runner_os }}
        run: |
          target_title="news-raw-${PUBLISHER}-${FROM_YEAR}-${TO_YEAR}-${MANIFEST_MODE}"
          active_titles="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow news-raw-archive.yml \
              --limit 100 \
              --json displayTitle,status \
              --jq '.[] |
                select(.status != "completed") |
                .displayTitle'
          )"
          if grep -Fxq "$target_title" <<<"$active_titles"; then
            echo "Shard already active: $target_title"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if gh workflow run news-raw-archive.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f publisher="$PUBLISHER" \
              -f from_year="$FROM_YEAR" \
              -f to_year="$TO_YEAR" \
              -f manifest_mode="$MANIFEST_MODE" \
              -f max_discovery_pages="$DISCOVERY_UNITS" \
              -f max_captures=500 \
              -f workers=4 \
              -f max_runtime_minutes=300 \
              -f auto_continue=true \
              -f runner_os="$TARGET_RUNNER_OS"; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Could not dispatch $target_title after $attempt attempts." >&2
              exit 1
            fi
            delay=$((attempt * 10))
            echo "Dispatch failed; retrying in ${delay}s."
            sleep "$delay"
          done
