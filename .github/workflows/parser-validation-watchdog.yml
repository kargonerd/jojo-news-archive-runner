name: Parser validation watchdog

on:
  schedule:
    # Periodically fill free validation slots. Accelerator jobs also chain
    # their own batches, so this is a conservative recovery/backfill cadence.
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: parser-validation-watchdog
  cancel-in-progress: false

env:
  B2_ARCHIVE_KEY_ID: ${{ secrets.B2_ARCHIVE_KEY_ID }}
  B2_ARCHIVE_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_APPLICATION_KEY }}
  B2_ARCHIVE_BUCKET: ${{ secrets.B2_ARCHIVE_BUCKET }}
  B2_REMOTE: jojo-b2
  # Keep background acquisition within the explicitly approved controlled
  # concurrency budget. Operators can raise this deliberately when capacity
  # and storage cost have been reviewed.
  MAX_STANDARD_CONCURRENCY: "2"
  MAX_DISPATCH_PER_RUN: "2"
  # Bloomberg has completed the current research acceptance cycle. Reuters is
  # outside the active convergence objective; both remain supported by the
  # generic planner and can be re-enabled by editing this explicit queue.
  VALIDATION_PUBLISHERS: >-
    ft wsj nyt ap axios npr nikkei zaobao aljazeera scmp caixin
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Validate private B2 storage
        run: |
          python services/olds-api/tools/verify_b2_private_bucket.py
          rclone config create "$B2_REMOTE" b2 \
            account "$B2_ARCHIVE_KEY_ID" \
            key "$B2_ARCHIVE_APPLICATION_KEY" \
            --non-interactive

      - name: Restore validation summaries
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/archive-state"
          copy_summary() {
            remote_dir="$1"
            destination="$2"
            listing="$RUNNER_TEMP/summary-listing.txt"
            errors="$RUNNER_TEMP/summary-listing-errors.txt"
            if ! rclone lsf "$remote_dir" --files-only \
                >"$listing" 2>"$errors"; then
              if grep -qiE "directory not found|object not found" "$errors"; then
                return 0
              fi
              cat "$errors" >&2
              return 1
            fi
            if grep -Fxq "summary.json" "$listing"; then
              mkdir -p "$destination"
              rclone copyto "$remote_dir/summary.json" \
                "$destination/summary.json" \
                --retries 8 --low-level-retries 20
            fi
          }
          source_roots=(
            "ap/2010-2015/sitemap-wayback"
            "ap/2016-2026/sitemap-wayback"
            "bloomberg/2010-2015/sitemap-wayback"
            "bloomberg/2016-2026/sitemap-wayback"
            "ft/2010-2015/sitemap-wayback"
            "ft/2016-2026/sitemap-wayback"
            "nyt/2010-2015/sitemap-wayback"
            "nyt/2016-2026/sitemap-wayback"
            "reuters/2010-2015/wayback-urlkey"
            "reuters/2016-2020/wayback-urlkey"
            "reuters/2021-2026/reuters-sitemap-wayback"
            "wsj/2010-2015/wayback-urlkey"
            "wsj/2016-2026/wayback-urlkey"
            "wsj/2016-2026/wayback"
            "axios/2017-2026/wayback-urlkey"
            "npr/2010-2015/wayback-urlkey"
            "npr/2016-2026/wayback-urlkey"
            "nikkei/2010-2015/wayback-urlkey"
            "nikkei/2016-2026/wayback-urlkey"
            "zaobao/2010-2015/wayback-urlkey"
            "zaobao/2016-2026/wayback-urlkey"
            "aljazeera/2010-2015/sitemap-wayback"
            "aljazeera/2016-2026/sitemap-wayback"
            "scmp/2010-2015/wayback-urlkey"
            "scmp/2016-2026/wayback-urlkey"
            "caixin/2010-2015/wayback-urlkey"
            "caixin/2016-2026/wayback-urlkey"
          )
          available_source_shards="$RUNNER_TEMP/available-source-shards.txt"
          source_capacity_root="$RUNNER_TEMP/source-capacity"
          mkdir -p "$source_capacity_root"
          : > "$available_source_shards"
          for source_root in "${source_roots[@]}"; do
            copy_summary \
              "${B2_REMOTE}:${B2_ARCHIVE_BUCKET}/news-archive/v1/${source_root}/state" \
              "$RUNNER_TEMP/archive-state/${source_root}/state"
            object_listing=""
            if object_listing="$(
              rclone lsl \
                "${B2_REMOTE}:${B2_ARCHIVE_BUCKET}/news-archive/v1/${source_root}/catalog/manifest.jsonl.gz" \
                --timeout 30s --contimeout 10s \
                --retries 1 --low-level-retries 1 \
                2>/dev/null
            )" && [ -n "$object_listing" ]; then
              echo "$source_root" >> "$available_source_shards"
              capacity_remote="${B2_REMOTE}:${B2_ARCHIVE_BUCKET}/news-archive/v1/${source_root}/catalog/manifest-summary.json"
              if capacity_listing="$(
                rclone lsl "$capacity_remote" \
                  --timeout 30s --contimeout 10s \
                  --retries 1 --low-level-retries 1 \
                  2>/dev/null
              )" && [ -n "$capacity_listing" ]; then
                capacity_local="${source_capacity_root}/${source_root}/manifest-summary.json"
                mkdir -p "$(dirname "$capacity_local")"
                rclone copyto "$capacity_remote" "$capacity_local" \
                  --retries 8 --low-level-retries 20
              fi
            fi
          done
          # Formal parser-validation summaries are execution state under v2,
          # not part of a publisher's v1 canonical raw source tree. Restore
          # both the original validation cohort and formal holdout cohorts;
          # a current-version holdout that passes all gates is authoritative
          # convergence evidence and must not be dispatched again. Smoke
          # cohorts remain deliberately excluded.
          rclone copy \
            "${B2_REMOTE}:${B2_ARCHIVE_BUCKET}/news-archive/v2/validation-state" \
            "$RUNNER_TEMP/archive-state" \
            --include "validation/*/*/state/summary.json" \
            --include "holdout-v*/*/*/state/summary.json" \
            --include "validation/*/*/state/rotation-audit.json" \
            --include "holdout-v*/*/*/state/rotation-audit.json" \
            --transfers 16 --checkers 32 \
            --retries 8 --low-level-retries 20

      - name: Plan available validation slots
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$RUNNER_TEMP/runs.json"
          active="$RUNNER_TEMP/active-titles.txt"
          gh run list --limit 100 \
            --json status,displayTitle > "$runs"
          jq -r '
            .[]
            | select(
                .status == "in_progress"
                or .status == "queued"
                or .status == "waiting"
                or .status == "pending"
                or .status == "requested"
              )
            | .displayTitle
          ' "$runs" > "$active"
          active_count="$(
            jq '[
              .[]
              | select(
                .status == "in_progress"
                or .status == "queued"
                or .status == "waiting"
                or .status == "pending"
                or .status == "requested"
              )
            ] | length' "$runs"
          )"
          # This watchdog itself occupies one runner while planning. Its slot
          # becomes available as soon as dispatch completes.
          available=$((MAX_STANDARD_CONCURRENCY - active_count + 1))
          if [ "$available" -lt 0 ]; then
            available=0
          fi
          dispatches="$available"
          if [ "$dispatches" -gt "$MAX_DISPATCH_PER_RUN" ]; then
            dispatches="$MAX_DISPATCH_PER_RUN"
          fi
          python \
            services/olds-api/tools/plan_parser_validation_watchdog.py \
            --state-root "$RUNNER_TEMP/archive-state" \
            --active-titles "$active" \
            --available-source-shards \
              "$RUNNER_TEMP/available-source-shards.txt" \
            --source-capacity-root "$RUNNER_TEMP/source-capacity" \
            --max-dispatch "$dispatches" \
            --publishers $VALIDATION_PUBLISHERS \
            --output "$RUNNER_TEMP/validation-plan.json"
          echo "tasks=$(jq -c '.tasks' \
            "$RUNNER_TEMP/validation-plan.json")" >> "$GITHUB_OUTPUT"
          {
            echo "### Parser validation watchdog"
            echo
            echo '```json'
            jq '{
              targetCells,
              readyCells,
              activeCells,
              pendingCells,
              summariesRead,
              unresolved: [
                .cellProgress[]
                | select(.ready == false)
              ],
              tasks
            }' "$RUNNER_TEMP/validation-plan.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch missing publisher years
        if: ${{ steps.plan.outputs.tasks != '[]' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TASKS: ${{ steps.plan.outputs.tasks }}
        run: |
          set -euo pipefail
          while IFS= read -r task; do
            publisher="$(jq -r '.publisher' <<<"$task")"
            year="$(jq -r '.year' <<<"$task")"
            cohort="$(jq -r '.cohort' <<<"$task")"
            shard="$(jq -r '.sourceManifestShard' <<<"$task")"
            runner="$(jq -r '.runnerOs' <<<"$task")"
            enable_ft_infini_direct_discovery=false
            if [ "$publisher" = "ft" ]; then
              enable_ft_infini_direct_discovery=true
            fi
          # Each dispatched validation run starts with an 800-article budget,
          # matching the project's independent-sample acceptance gate.
          gh workflow run parser-validation-accelerator.yml \
              --ref "$DEFAULT_BRANCH" \
              -f publisher="$publisher" \
              -f cohort="$cohort" \
              -f year="$year" \
              -f source_manifest_shard="$shard" \
              -f max_captures=800 \
              -f workers=2 \
              -f max_runtime_minutes=300 \
              -f auto_continue=true \
              -f enable_ft_infini_direct_discovery="$enable_ft_infini_direct_discovery" \
              -f runner_os="$runner"
            echo "Dispatched $cohort $publisher/$year from $shard on $runner."
          done < <(jq -c '.[]' <<<"$TASKS")
